# Window Rules Configuration
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more information
#
# Workspace Organization:
# - Workspace 1: Main/Browser - Primary browsing and general use
# - Workspace 2: Development - Code editors, terminals, development tools
# - Workspace 3: Communication - Chat apps, messaging, video calls
# - Workspace 4: Media - Music players, media viewers, entertainment
# - Workspace 5-10: Flexible/Other - Available for manual organization
# - Special workspace (magic): Floating utilities, scratchpad

# ============================================================================
# System & Core Rules
# ============================================================================

# Ignore maximize requests from all apps
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# ============================================================================
# System UI Windows (Floating)
# ============================================================================

# Hyprland-run launcher
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Rofi menu/launcher - floating and centered
windowrule {
    name = rofi-launcher
    match:class = ^Rofi$

    float = yes
    center = yes
}

# Mako notifications - floating, positioned
windowrule {
    name = mako-notifications
    match:class = ^mako$

    float = yes
    move = 100 100
}

# System dialogs and popups - floating
windowrule {
    name = system-dialogs
    match:class = ^(zenity|Zenity|yad|Yad)$

    float = yes
    center = yes
}

# ============================================================================
# EWW Bar Windows (System UI)
# ============================================================================

# EWW bar0 - pinned, floating, no focus
windowrule {
    name = eww-bar0
    match:class = ^Eww$
    match:title = ^Eww - bar0$

    pin = true
    float = yes
    move = 0 0
    no_focus = true
}

# EWW bar1 - pinned, floating, no focus
windowrule {
    name = eww-bar1
    match:class = ^Eww$
    match:title = ^Eww - bar1$

    pin = true
    float = yes
    move = 1920 0
    no_focus = true
}

# EWW control panel0 - pinned, floating, no focus
windowrule {
    name = eww-control-panel0
    match:class = ^Eww$
    match:title = ^Eww - control_panel0$

    pin = true
    float = yes
    move = 908 40
    no_focus = true
}

# EWW control panel1 - pinned, floating, no focus
windowrule {
    name = eww-control-panel1
    match:class = ^Eww$
    match:title = ^Eww - control_panel1$

    pin = true
    float = yes
    move = 2828 40
    no_focus = true
}

# ============================================================================
# Development Tools → Workspace 2
# ============================================================================

# Code editors - VS Code, Cursor, Neovim, etc.
windowrule {
    name = code-editors
    match:class = ^(Code|code|cursor|Cursor|neovide|Neovide|nvim-qt|Nvim-qt)$

    workspace = 2
}

# Terminals - Alacritty and other terminals (floating)
windowrule {
    name = terminals
    match:class = ^(Alacritty|alacritty|kitty|Kitty|foot|Foot|wezterm|Wezterm)$

    workspace = 2
    float = yes
    size = 1200 700
    center = yes
}

# Development tools - Git GUIs, IDEs
windowrule {
    name = dev-tools
    match:class = ^(GitKraken|gitkraken|GitHub Desktop|github-desktop|JetBrains|jetbrains|idea|IntelliJ)$

    workspace = 2
}

# Floating: small utility windows and popups from dev tools
windowrule {
    name = dev-popups
    match:class = ^(Code|code|cursor|Cursor)$
    match:title = .*(popup|dialog|settings|preferences).*

    float = yes
    size = 800 600
    center = yes
}

# ============================================================================
# Communication & Browsing → Workspace 1 (Browser) & 3 (Communication)
# ============================================================================

# Browsers → Workspace 1
windowrule {
    name = browsers
    match:class = ^(firefox|Firefox|chrome|Chrome|chromium|Chromium|brave|Brave|vivaldi|Vivaldi|edge|Edge|librewolf|LibreWolf)$

    workspace = 1
}

# Chat apps → Workspace 3
windowrule {
    name = chat-apps
    match:class = ^(discord|Discord|slack|Slack|element|Element|telegram|Telegram|signal|Signal|thunderbird|Thunderbird)$

    workspace = 3
}

# Video call apps → Workspace 3, floating when active
windowrule {
    name = video-calls
    match:class = ^(zoom|Zoom|teams|Teams|webex|Webex|jitsi|Jitsi)$

    workspace = 3
    float = yes
    size = 1200 800
    center = yes
}

# ============================================================================
# Media Applications → Workspace 4
# ============================================================================

# Music players → Workspace 4
windowrule {
    name = music-players
    match:class = ^(spotify|Spotify|ncspot|ncspot|amarok|Amarok|rhythmbox|Rhythmbox|clementine|Clementine)$

    workspace = 4
}

# Media viewers and image viewers → Workspace 4
windowrule {
    name = media-viewers
    match:class = ^(feh|Feh|sxiv|Sxiv|imv|Imv|gwenview|Gwenview|eog|EOG|ristretto|Ristretto)$

    workspace = 4
}

# Video players → Workspace 4, optionally floating
windowrule {
    name = video-players
    match:class = ^(mpv|Mpv|vlc|VLC|smplayer|SMPlayer|celluloid|Celluloid)$

    workspace = 4
    float = yes
    size = 1280 720
    center = yes
}

# ============================================================================
# Utilities (Floating)
# ============================================================================

# File managers - floating or assigned workspace
windowrule {
    name = file-managers
    match:class = ^(thunar|Thunar|nautilus|Nautilus|dolphin|Dolphin|pcmanfm|Pcmanfm)$

    float = yes
    size = 1000 700
    center = yes
}

# System tools - Pavucontrol, settings, etc.
windowrule {
    name = system-tools
    match:class = ^(pavucontrol|Pavucontrol|gnome-control-center|Gnome-control-center|lxappearance|Lxappearance)$

    float = yes
    size = 800 600
    center = yes
}

# Screenshot tools - floating
windowrule {
    name = screenshot-tools
    match:class = ^(flameshot|Flameshot|grim|grimblast)$

    float = yes
    center = yes
}

# ============================================================================
# Floating Utility Windows
# ============================================================================

# Calculator - floating, centered
windowrule {
    name = calculator
    match:class = ^(gnome-calculator|Calculator|galculator|Galculator|qalculate|Qalculate)$

    float = yes
    size = 400 600
    center = yes
}

# Color pickers - floating
windowrule {
    name = color-pickers
    match:class = ^(gpick|Gpick|gcolor3|Gcolor3|color-picker)$

    float = yes
    size = 500 400
    center = yes
}

# Small utility windows - floating by default
windowrule {
    name = small-utilities
    match:title = ^(Calculator|Color Picker|About|Preferences|Settings)$

    float = yes
    center = yes
}

# Note: Dialog and tooltip windows are typically handled automatically
# by Hyprland or matched through their class/title patterns in other rules above
