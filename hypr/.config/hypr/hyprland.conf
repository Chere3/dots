# Hyprland Configuration
# This is the main configuration file that sources all modular config files
# Refer to the wiki for more information: https://wiki.hypr.land/Configuring/

# Source all configuration files from conf.d directory
source = conf.d/monitors.conf
source = conf.d/variables.conf
source = conf.d/env.conf
source = conf.d/autostart.conf
source = conf.d/general.conf
source = conf.d/decoration.conf
source = conf.d/animations.conf
source = conf.d/input.conf
source = conf.d/layouts.conf
source = conf.d/keybinds.conf
source = conf.d/windowrules.conf
