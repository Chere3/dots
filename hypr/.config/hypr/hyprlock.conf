# Hyprlock Configuration
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(cba6f7ee)
    inner_color = rgba(1e1e2eaa)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(f9e2af)
    numlock_color = rgb(89b4fa)
    bothlock_color = rgb(f38ba8)
    invert_numlock = false
    swap_font_color = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(cdd6f4ff)
    font_size = 25
    font_family = monospace
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(cdd6f4ff)
    font_size = 50
    font_family = monospace
    position = 0, -40
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +'%A, %d %B')"
    color = rgba(cdd6f4aa)
    font_size = 15
    font_family = monospace
    position = 0, -300
    halign = center
    valign = center
}
