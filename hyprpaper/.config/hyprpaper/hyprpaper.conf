# Hyprpaper Configuration
# This file configures wallpapers for Hyprland
# See: https://github.com/hyprwm/hyprpaper

# Preload wallpapers for faster switching
preload = ~/Downloads/284_365_path_of_miranda_alone_by_snatti89_da1idhz.png

# Set wallpaper for each monitor
# Format: wallpaper = monitor, /path/to/wallpaper
# wallpaper = eDP-1, /path/to/wallpaper.jpg

# Example configuration (uncomment and modify paths as needed):
# preload = ~/Pictures/wallpapers/wallpaper.jpg
# wallpaper = eDP-1, ~/Pictures/wallpapers/wallpaper.jpg

# For multiple monitors, add multiple wallpaper lines:
# wallpaper = eDP-1, /path/to/wallpaper1.jpg
# wallpaper = HDMI-A-1, /path/to/wallpaper2.jpg

# Set wallpaper fill mode (optional)
# Options: center, fill, fit, stretch, tile
# wallpaper = eDP-1, /path/to/wallpaper.jpg, fill
