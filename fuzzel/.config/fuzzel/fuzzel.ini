# Fuzzel configuration
# Catppuccin Mocha theme - matching bar and mako

[main]
font=JetBrainsMono Nerd Font:size=9
terminal=alacritty
dpi-aware=yes
prompt="> "
icons-enabled=yes
width=80
layer=overlay
exit-on-keyboard-focus-loss=no
inner-pad=15
fields=filename,name
line-height=20
horizontal-pad=15

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection-match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
border=cba6f7ff
